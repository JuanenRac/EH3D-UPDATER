<title id="t">EH3D-UPDATER architecture</title>
<desc id="d">EH3D-UPDATER is a Python tool with a Qt Quick window and a command line. It lists the public repositories of the owner on GitHub as candidates and accepts only those whose root eh3d.project.json validates and declares the ecosystem EH3D, so nothing lists the projects. It compares each local checkout with GitHub, and installs or updates one project at a time: the replacement is cloned, merged without force, built and checked in a staging clone, the previous installation is kept as a backup, and every attempt is written to a hash-chained evidence log. It is tested on a computer with a fake GitHub and local repositories; it has not been used against the real GitHub for real work.</desc>
