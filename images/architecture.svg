<text x="36" y="70" font-family="'Segoe UI','Noto Sans','Noto Sans CJK SC','Microsoft YaHei','Yu Gothic','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8B949E" text-anchor="start">Finds, installs and updates the repositories of the suite on your PC, one at a time and only after a confirmation.</text>
