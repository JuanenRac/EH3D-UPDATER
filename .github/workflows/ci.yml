name: EH3D CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # once a week, to notice a change in another repository of the suite
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate manifest, version, documentation and secret policy
        run: python tools/ci_validate.py
      - name: Pictures of the README
        run: |
          python -I tools/make_architecture.py --check
          python -I tools/make_structure.py --check --readmes
      - name: Compile Python sources without running versioning build scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {".git", ".venv", "node_modules", "dist", "build", "target", "__pycache__"}
          files = [path for path in Path(".").rglob("*.py") if not any(part in excluded for part in path.parts)]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"PYTHON_SYNTAX=PASS files={len(files)}")
          PY
      - name: Install Qt runtime libraries for the headless window tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Validate Updater manifest, discovery, install flow and the Qt bridge (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install ".[dev,gui]"
          PYTHONPATH=src python -m pytest tests -q
  python-versions:
    name: Tests on Python ${{ matrix.python-version }} (no Qt)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest Python the package promises (requires-python); the Qt window is tested above
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests without the window (the Qt tests are skipped when PySide6 is not installed)
        run: |
          python -m pip install ".[dev]"
          python -m pytest tests -q
      - name: The code still reads with the grammar of the oldest Python promised
        run: python -I -m unittest discover -s tools -p "test_python_minimum.py"
  windows:
    name: Tests on Windows
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the tests (renames, read-only files and .bat build scripts behave differently on Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install ".[dev,gui]"
          python -m pytest tests -q
  suite-contract:
    name: Manifests of the suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the manifest of every repository of the suite with the parser of the Updater
        env:
          # the token of the run raises the limit of the GitHub API from 60 to 1000 requests an hour
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install .
          mkdir -p "$RUNNER_TEMP/empty-workspace"
          python -m eh3d_updater.main --cli status --json --workspace "$RUNNER_TEMP/empty-workspace" > status.json 2> warnings.txt || { cat warnings.txt; exit 1; }
          cat warnings.txt
          if grep -E "invalid manifest|version unknown" warnings.txt > problems.txt; then
            { echo "### Manifests the Updater cannot read"; echo; sed 's/^/- /' problems.txt; } >> "$GITHUB_STEP_SUMMARY"
            echo "A repository has a manifest that the Updater rejects (listed above)."
            exit 1
          fi
